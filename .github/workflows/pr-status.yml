name: PR Status

# Labels and comments only. Never checks out or runs PR code, so the write
# token is not a risk here — see the note on the checkout step below.
#
# Split from BloatWare on purpose:
#   bloatware.yml  `pull_request`          read-only token, safe to run PR code
#   pr-status.yml  `workflow_run`  write token, touches only the API
#
# `workflow_run` rather than `pull_request` because these two would otherwise
# race: the status job has to see BloatWare's conclusion, not guess at it.
#
# It also re-runs the repository rules itself, from the base branch, against the
# pull request API rather than a checkout. That is not duplication for its own
# sake: it is what makes the rules un-disableable, and it is the only half that
# can talk to the author.
on:
  workflow_run:
    workflows: ["BloatWare"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

# A new push supersedes the previous cycle; only the latest labels/comments matter.
concurrency:
  group: pr-status-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      # The base branch, not the PR. This is the trusted copy of the guard; the
      # PR is never checked out here.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect changed files
        id: collect
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const headSha = context.payload.workflow_run.head_sha;

            // pull_requests is populated for pull_request runs, but fall back to
            // matching the head sha so a missing entry cannot silently skip labelling.
            let prNumber = context.payload.workflow_run.pull_requests?.[0]?.number;
            if (!prNumber) {
              const { data: pulls } = await github.rest.pulls.list({
                owner: context.repo.owner, repo: context.repo.repo, state: 'open',
              });
              const match = pulls.find(p => p.head.sha === headSha);
              if (!match) { core.info('No open PR for ' + headSha); return; }
              prNumber = match.number;
            }

            // The API's per-file patch, so the guard sees what the author wrote
            // without a checkout. BloatWare reads the worktree instead; this
            // path is the one that survives a PR trying to neuter the guard.
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: prNumber, per_page: 100,
            });
            fs.writeFileSync('pr-files.json', JSON.stringify({
              files: files.map(f => ({ filename: f.filename, patch: f.patch || '' })),
            }));
            core.setOutput('pr-number', prNumber);

      - name: Enforce repository rules
        if: steps.collect.outputs.pr-number != ''
        run: |
          set -euo pipefail
          # Non-zero here would mask the label/comment step below, so the exit
          # code is deliberately discarded — the verdict is read from the report.
          python .github/scripts/repo_guard.py \
            --input pr-files.json \
            --report pr-guard-report.json || true

      - name: Apply labels and comment
        if: steps.collect.outputs.pr-number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- pr-status -->';
            const PASS = 'PIPELINE PASSED';
            const FAIL = 'PIPELINE FAILED';
            const REVIEW = 'REVIEW REQUIRED';
            const RULEBOOK = 'https://github.com/emtypyie/DihScrapper/blob/main/RULEBOOK.md';

            const prNumber = Number('${{ steps.collect.outputs.pr-number }}');
            const run = context.payload.workflow_run;

            let guard = { ok: true, findings: [] };
            if (fs.existsSync('pr-guard-report.json')) {
              guard = JSON.parse(fs.readFileSync('pr-guard-report.json', 'utf8'));
            }

            // Authoritative: BloatWare's conclusion AND this workflow's own scan.
            const violations = guard.findings || [];
            const ok = run.conclusion === 'success' && violations.length === 0;

            // Create any missing label, so a fresh repo or a renamed label still works.
            const wanted = ok
              ? [{ name: PASS, color: '0e8a16' }, { name: REVIEW, color: 'fbca04' }]
              : [{ name: FAIL, color: 'b60205' }];
            for (const l of wanted) {
              try {
                await github.rest.issues.createLabel({ ...context.repo, name: l.name, color: l.color });
              } catch (e) {
                if (e.status !== 422) throw e; // already exists
              }
            }

            // Reconcile rather than only add: a stale PASSED label on a red run is worse
            // than no label at all.
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: prNumber,
            });
            const current = pr.labels.map(l => l.name);
            const add = wanted.map(l => l.name).filter(n => !current.includes(n));
            const drop = [PASS, FAIL, REVIEW].filter(n => !wanted.map(l => l.name).includes(n) && current.includes(n));

            if (add.length) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: prNumber, labels: add });
            }
            for (const n of drop) {
              await github.rest.issues.removeLabel({ ...context.repo, issue_number: prNumber, name: n });
            }

            const RULEBOOK_LINK = `Rules, and how to satisfy each one: [RULEBOOK.md](${RULEBOOK})`;

            let body;
            if (ok) {
              body = `${MARKER}\n@${pr.user.login} — all pipeline checks passed go get some coffee it would take time to get this reviewed.\n\n${RULEBOOK_LINK}`;
            } else {
              let detail = '';
              if (violations.length) {
                const rows = violations.map(f => {
                  const where = f.line ? `${f.file}:${f.line}` : f.file;
                  return `| ${f.title} | \`${where}\` | ${f.detail} |`;
                });
                detail =
                  `\n\n**${violations.length} rule violation(s) — fix these and push again:**\n\n` +
                  `| Rule | Where | Detail |\n| --- | --- | --- |\n${rows.join('\n')}\n`;
              } else {
                // Green rules, red pipeline: the failure is formatting or CI.
                detail =
                  `\n\nNo rule violations — the failure is in the run itself: ` +
                  `[${run.name} #${run.id}](${run.html_url})\n`;
              }
              body = `${MARKER}\n@${pr.user.login} — pipeline failed ❌ Cannot Merge in main, Please Do follow the guidelines and update the PR lol${detail}\n\n${RULEBOOK_LINK}`;
            }

            // One sticky comment: edit the existing one so pushes do not spam the PR.
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: prNumber, per_page: 100,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body?.includes(MARKER));
            if (existing) {
              if (existing.body !== body) {
                await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
              }
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: prNumber, body });
            }

            core.info(`PR #${prNumber}: ${ok ? 'passed' : 'failed'} — labels + comment updated`);
