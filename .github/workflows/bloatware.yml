name: BloatWare

# Two gates, in order:
#   1. repository rules — no .env, no CI edits, no secrets (RULEBOOK.md)
#   2. ruff format/lint/compile on the Python the PR actually touches
#
# No `paths:` filter, deliberately. It used to be scoped to **/*.py, which meant
# a PR whose only content was a committed .env or a rewritten workflow file never
# triggered this workflow at all — precisely the changes the rules exist to stop.
# The ruff half no-ops on its own when a PR touches no Python.
#
# The formatting gate is scoped to changed files so an unrelated pre-existing
# offender elsewhere in the tree cannot fail an otherwise fine PR.
on:
  pull_request:

permissions:
  contents: read

jobs:
  formatting:
    name: "🦞 BloatWare"
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the merge base with the base branch is reachable
          # and a shallow clone cannot produce a bogus diff.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce repository rules
        run: |
          set -euo pipefail
          # The guard is read out of the base ref, not the worktree. Running the
          # worktree copy would mean a PR that edits .github/scripts/repo_guard.py
          # gets graded by its own rules, and the base tree is not something a PR
          # can change. PR Status repeats this check independently.
          if ! git show "origin/$BASE:.github/scripts/repo_guard.py" > "$RUNNER_TEMP/repo_guard.py"; then
            echo "::error::repo_guard.py is missing from the base branch, cannot enforce repository rules"
            exit 1
          fi
          python "$RUNNER_TEMP/repo_guard.py" \
            --base "origin/$BASE" \
            --report guard-report.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Install formatter
        run: pip install --disable-pip-version-check ruff==0.14.4

      - name: Collect changed Python files
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          {
            git diff --name-only --diff-filter=ACMR "origin/$BASE...HEAD"
          } | grep -E '\.py$' | sort -u > changed.txt || true
          echo "Changed Python files:"
          cat changed.txt
          count=$(wc -l < changed.txt | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        if: steps.changed.outputs.count != '0'
        run: ruff format --check --diff $(cat changed.txt)

      - name: Check lint
        if: steps.changed.outputs.count != '0'
        run: ruff check $(cat changed.txt)

      - name: Verify the files compile
        if: steps.changed.outputs.count != '0'
        run: |
          set -euo pipefail
          while read -r f; do
            echo "compiling $f"
            python -m py_compile "$f"
          done < changed.txt
