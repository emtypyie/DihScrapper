# Ruff config for the BloatWare workflow.
# line-length 100 matches what this codebase already uses: the pre-existing
# main.py and uploader.py both have lines up to 99 chars, so the formatter
# default of 88 would rewrite untouched code and fail the gate on files that
# were never formatted in the first place.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# ruff's default set: pyflakes + a subset of pycodestyle errors.
select = ["E4", "E7", "E9", "F"]
