services:
  dihscrapper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dihscrapper
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_ROOT: /app/HOME
      GITHUB_OWNER: ${GITHUB_OWNER:-myrachane}
      GITHUB_DATA_REPO: ${GITHUB_DATA_REPO:-ScrapedDih}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-main}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      DISCORD_API: ${DISCORD_API}
      MEDIA_MAX_SIZE: 25
      CATCHUP_LIMIT: 200
      CATCHUP_MAX: 5000
      PUSH_INTERVAL: 300
    volumes:
      - home:/app/HOME
    networks:
      - dihscrapper-net

volumes:
  home:
    driver: local

networks:
  dihscrapper-net:
    driver: bridge
